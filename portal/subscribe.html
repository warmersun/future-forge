<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warmer Sun Cloud — Subscribe</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --text: #e8eef9;
        --dim: #94a3b8;
        --accent: #a78bfa;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: var(--dim);
        line-height: 1.5;
      }
      #clerk-mount {
        margin-top: 1.15rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Warmer Sun Cloud</h1>
      <p id="status">Loading plans…</p>
      <div id="clerk-mount"></div>
    </main>
    <script type="module">
      const CLERK_APPEARANCE = {
        variables: {
          colorPrimary: "#a78bfa",
          colorPrimaryForeground: "#0c1220",
          colorBackground: "#121a2b",
          colorForeground: "#e8eef9",
          colorMuted: "#1a2438",
          colorMutedForeground: "#94a3b8",
          colorNeutral: "#94a3b8",
          colorInput: "#1a2438",
          colorInputForeground: "#e8eef9",
          colorBorder: "#2a3a58",
          colorModalBackdrop: "rgba(7, 11, 20, 0.78)",
          borderRadius: "14px",
        },
      };

      const status = document.getElementById("status");
      const mount = document.getElementById("clerk-mount");

      function clerkFrontendApiHost(publishableKey) {
        const parts = String(publishableKey || "").trim().split("_");
        if (parts.length < 3) throw new Error("Invalid Clerk publishable key");
        const decoded = atob(parts.slice(2).join("_"));
        return decoded.endsWith("$") ? decoded.slice(0, -1) : decoded;
      }

      function loadScript(src, attrs = {}) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.crossOrigin = "anonymous";
          for (const [k, v] of Object.entries(attrs)) script.setAttribute(k, v);
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(`Failed to load ${src}`));
          document.head.appendChild(script);
        });
      }

      const health = await fetch("/api/health").then((r) => r.json());
      const pk = health?.clerk?.publishableKey;
      if (!health?.clerk?.enabled || !pk) {
        status.textContent = "Subscriptions are off on this portal (Clerk keys missing).";
        throw new Error("clerk off");
      }

      const host = clerkFrontendApiHost(pk);
      await loadScript(`https://${host}/npm/@clerk/ui@1/dist/ui.browser.js`);
      await loadScript(`https://${host}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, {
        "data-clerk-publishable-key": pk,
      });

      const Clerk = window.Clerk;
      await Clerk.load({
        ui: { ClerkUI: window.__internal_ClerkUICtor },
        appearance: CLERK_APPEARANCE,
      });

      status.textContent =
        "A monthly subscription includes the hosted co-inventor. Self-host if you want it free.";
      if (typeof Clerk.mountPricingTable === "function") {
        Clerk.mountPricingTable(mount, { appearance: CLERK_APPEARANCE, for: "user" });
      } else {
        status.textContent = "Turn on Clerk Billing, then reload this page.";
      }
    </script>
  </body>
</html>

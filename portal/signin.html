<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warmer Sun Cloud — Sign in</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --text: #e8eef9;
        --dim: #94a3b8;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: var(--dim);
        line-height: 1.5;
      }
      #status {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Warmer Sun Cloud</h1>
      <p id="status">Loading Sign in…</p>
    </main>
    <script type="module">
      const BOUNCE_KEY = "ff-account-portal-bounce";
      const status = document.getElementById("status");
      const params = new URLSearchParams(location.search);
      const device = params.get("device") || "";
      const returnTo = params.get("return") || "";

      function clerkFrontendApiHost(publishableKey) {
        const parts = String(publishableKey || "").trim().split("_");
        if (parts.length < 3) throw new Error("Invalid Clerk publishable key");
        const decoded = atob(parts.slice(2).join("_"));
        const host = decoded.endsWith("$") ? decoded.slice(0, -1) : decoded;
        if (!host || host.includes("/") || /\s/.test(host)) {
          throw new Error("Invalid Clerk Frontend API host");
        }
        return host;
      }

      function accountPortalHost(publishableKey) {
        const host = clerkFrontendApiHost(publishableKey);
        const dev = ".clerk.accounts.dev";
        if (host.endsWith(dev)) return `${host.slice(0, -dev.length)}.accounts.dev`;
        if (host.startsWith("clerk.")) return `accounts.${host.slice("clerk.".length)}`;
        throw new Error("Cannot derive Account Portal host");
      }

      function loadScript(src, attrs = {}) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.crossOrigin = "anonymous";
          for (const [k, v] of Object.entries(attrs)) script.setAttribute(k, v);
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(`Failed to load ${src}`));
          document.head.appendChild(script);
        });
      }

      function isAllowedGameReturnUrl(href) {
        try {
          const u = new URL(String(href || ""));
          if (u.protocol !== "http:" && u.protocol !== "https:") return false;
          if (u.username || u.password) return false;
          const host = String(u.hostname || "").toLowerCase();
          if (!host) return false;
          if (host === "127.0.0.1" || host === "localhost") return true;
          if (host === "warmersun.com" || host.endsWith(".warmersun.com")) return true;
          if (host.endsWith(".ts.net")) return true;
          return false;
        } catch {
          return false;
        }
      }

      function readBounced() {
        try {
          return sessionStorage.getItem(BOUNCE_KEY) === "1";
        } catch {
          return false;
        }
      }

      function writeBounced(on) {
        try {
          if (on) sessionStorage.setItem(BOUNCE_KEY, "1");
          else sessionStorage.removeItem(BOUNCE_KEY);
        } catch {
          /* private mode */
        }
      }

      async function complete(token) {
        const res = await fetch("/api/device/complete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ code: device }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          throw new Error(data.error || "Could not finish handshake");
        }
      }

      try {
      const health = await fetch("/api/health").then((r) => r.json());
      const pk = health?.clerk?.publishableKey;
      if (!health?.clerk?.enabled || !pk) {
        status.textContent = "Sign in is off on this portal (Clerk keys missing).";
        throw new Error("clerk off");
      }
      const returnOk = Boolean(returnTo && isAllowedGameReturnUrl(returnTo));
      if (!device && !returnOk) {
        status.textContent =
          "Open Sign in from Future Forge on your computer (http://127.0.0.1:8765). This page needs a device code from the game.";
        throw new Error("no device");
      }

      const here = `${location.origin}${location.pathname}${location.search}`;
      const portal = new URL(`https://${accountPortalHost(pk)}/sign-in`);
      portal.searchParams.set("redirect_url", here);

      const host = clerkFrontendApiHost(pk);
      await loadScript(`https://${host}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, {
        "data-clerk-publishable-key": pk,
      });
      const Clerk = window.Clerk;
      await Clerk.load();

      if (!Clerk.session) {
        if (readBounced()) {
          writeBounced(false);
          status.textContent =
            "Sign in did not finish. Open Sign in from Future Forge again.";
        } else {
          writeBounced(true);
          status.textContent = "Opening the account portal…";
          location.replace(portal.href);
        }
      } else {
        writeBounced(false);
        const token = await Clerk.session.getToken();
        if (!token) throw new Error("Could not read the session");
        if (device) await complete(token);
        if (returnOk) {
          status.textContent = "Signed in. Returning to Future Forge…";
          location.replace(returnTo);
        } else {
          status.textContent = "Signed in. You can return to Future Forge.";
          try {
            window.close();
          } catch {
            /* ignore */
          }
        }
      }
      } catch (e) {
        if (!status.textContent || status.textContent === "Loading Sign in…") {
          status.textContent = e?.message || String(e);
        }
      }
    </script>
  </body>
</html>
